# Render.com deployment configuration
version: "1"
services:
  - type: web
    name: review-management-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: API_KEY
        generateValue: true
      - key: COHERE_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: DATABASE_URL
        value: sqlite:///./reviews.db
      - key: FRONTEND_URL
        sync: false  # Set to your Vercel URL